name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ------------------------------------------------------------------
        # 使用するOSイメージの一覧。
        # 最新のOSに上げたいときは、この os リストを書き換えるだけです。
        #
        # 2026-08時点でのGitHubホステッドランナーは以下 (詳細は
        # https://github.com/actions/runner-images を参照):
        #   ubuntu-latest -> ubuntu-24.04 (GA)  / ubuntu-26.04 (public preview)
        #   macos-latest  -> macos-26 (arm64)   / macos-15
        #   windows-latest-> windows-2025       / windows-2022
        #
        # 注意: Google は Linux/arm64 向けの Android ツール (SDK / NDK / aapt2) を
        # まだ配布していない (https://issuetracker.google.com/issues/227219818)。
        # そのため ubuntu-*-arm では aapt2 / CMake / NDK の x86_64 バイナリが
        # そのままでは実行できないが、Windows arm64 ランナーが x64 エミュレーションで
        # 動いているのと同様に、下記の "Enable x86_64 emulation" ステップで
        # binfmt_misc + qemu-user を有効化して x86_64 ツールを透過実行している。
        # 将来 Google が Linux/arm64 を公式サポートしたら、このエミュレーションは
        # 不要になり、ubuntu-*-arm もネイティブでビルドできるようになるはず。
        # その際は "Enable x86_64 emulation" ステップごと削除してよい。
        # ------------------------------------------------------------------
        os:
          - ubuntu-latest
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-latest
          - macos-26
          - macos-26-intel
          - windows-latest
          - windows-2025
          - windows-2022
          - windows-11-arm
          - windows-11-vs2026-arm

    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # arm系ランナー(ubuntu-*-arm / windows-11-*arm)では"tools"パッケージの
          # 依存先であるemulatorが配布されておらず、sdkmanagerが失敗するため
          # platform-tools のみインストールする。
          # macOS (arm64のmacos-26等) ではemulatorが配布されているため
          # この回避策は適用しない。
          packages: ${{ (startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'windows')) && contains(matrix.os, '-arm') && 'platform-tools' || 'tools platform-tools' }}

      # ubuntu-*-arm ランナー用: Google 配布の Android ツール (aapt2 / CMake /
      # NDK の clang など) は x86_64 版しか存在しないため、qemu-user で透過実行する。
      # Windows arm64 ランナーが x64 エミュレーションで動いているのと同じ戦略。
      - name: Enable x86_64 emulation via binfmt_misc + qemu-user
        if: startsWith(matrix.os, 'ubuntu') && contains(matrix.os, '-arm')
        run: |
          set -euo pipefail
          sudo apt-get update
          # Ubuntu 26.04 で qemu-user-static は仮想パッケージ化され
          # qemu-user-binfmt に改名されたため、両方に対応する
          QEMU_PKG=qemu-user-static
          apt-cache show qemu-user-binfmt > /dev/null 2>&1 && QEMU_PKG=qemu-user-binfmt
          sudo apt-get install -y --no-install-recommends "$QEMU_PKG"
          # パッケージの postinst が登録していない場合に備えて手動登録する。
          # ELF64 かつ e_machine=x86_64 (0x3e) のバイナリを qemu-x86_64 で透過実行する。
          if [ ! -e /proc/sys/fs/binfmt_misc/qemu-x86_64 ]; then
            INTERP=/usr/libexec/qemu-binfmt/x86_64-binfmt-P
            [ -x "$INTERP" ] || INTERP=/usr/bin/qemu-x86_64-static
            python3 - "$INTERP" | sudo tee /proc/sys/fs/binfmt_misc/register > /dev/null <<'EOF'
          import sys

          interp = sys.argv[1]
          magic = b"\x7fELF" + bytes.fromhex("020101000000000000000002003e00")
          mask = bytes.fromhex("fffffffffffefe00fffffffffffffffffeffffff")
          line = (
              ":qemu-x86_64:M::"
              + "".join(chr(b) if 0x20 <= b <= 0x7e else f"\\x{b:02x}" for b in magic)
              + ":"
              + "".join(chr(b) if 0x20 <= b <= 0x7e else f"\\x{b:02x}" for b in mask)
              + f":{interp}:OCF"
          )
          sys.stdout.write(line)
          EOF
          fi
          cat /proc/sys/fs/binfmt_misc/qemu-x86_64

      # OpenCV SDKはリポジトリ内に同梱されているので、
      # ローカルのAndroid Studioと同様に local.properties でパスを渡す。
      - name: Write local.properties
        shell: bash
        run: |
          OPENCV_DIR="${{ github.workspace }}/app/app/src/main/sdk/native/jni"
          # Windowsのワークスペースパスはバックスラッシュ・ドライブ文字のコロンを
          # Java propertiesとしてエスケープする必要がある
          OPENCV_DIR="${OPENCV_DIR//\\//}"
          OPENCV_DIR="${OPENCV_DIR//:/\\:}"
          printf 'opencv.dir=%s\n' "${OPENCV_DIR}" > app/local.properties
          cat app/local.properties

      - name: Build & Test & Lint
        working-directory: app
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: app-debug-${{ matrix.os }}
          path: app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload test & lint reports
        uses: actions/upload-artifact@v7
        if: ${{ failure() || cancelled() }}
        with:
          name: reports-${{ matrix.os }}
          path: |
            app/app/build/reports/tests/**
            app/app/build/reports/lint-*
          if-no-files-found: ignore